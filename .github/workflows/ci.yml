name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://resolve:resolve@localhost:5432/resolve?schema=public
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: resolve
          POSTGRES_USER: resolve
          POSTGRES_PASSWORD: resolve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolve -d resolve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run prisma:generate
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build -w @resolve/worker
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: docker compose config
      - name: Verify staging port bindings
        env:
          POSTGRES_PASSWORD: config-test
          METRICS_TOKEN: config-test
          WEBHOOK_ENCRYPTION_KEY: config-test
          STAGING_TLS_CERT: /tmp/resolve-staging-cert.pem
          STAGING_TLS_KEY: /tmp/resolve-staging-key.pem
        run: |
          set -o pipefail
          docker compose --env-file .env.staging.example -f docker-compose.yml -f docker-compose.staging.yml config --format json |
            jq -e '
              [.services | to_entries[] | select(.value.ports | length > 0) | .key] == ["proxy"] and
              (.services.proxy.ports | length == 1 and .[0].host_ip == "127.0.0.1" and
                .[0].published == "443" and .[0].target == 443 and .[0].protocol == "tcp")
            ' > /dev/null
