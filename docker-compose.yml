name: resolve-api

x-database-environment: &database-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-resolve}:${POSTGRES_PASSWORD:-resolve}@postgres:5432/${POSTGRES_DB:-resolve}?schema=public

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resolve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolve}
      POSTGRES_USER: ${POSTGRES_USER:-resolve}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: ['npm', 'run', 'prisma:migrate:deploy']
    depends_on:
      postgres:
        condition: service_healthy
    environment: *database-environment

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['npm', 'run', 'start:api']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *database-environment
      API_PORT: 3000
      BATCH_QUEUE_PREFIX: ${BATCH_QUEUE_PREFIX:-resolve}
      BLOCKING_MAX_CANDIDATES: ${BLOCKING_MAX_CANDIDATES:-100}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_KEY_MAX: ${RATE_LIMIT_KEY_MAX:-600}
      RATE_LIMIT_TENANT_MAX: ${RATE_LIMIT_TENANT_MAX:-3000}
      RATE_LIMIT_BATCH_KEY_MAX: ${RATE_LIMIT_BATCH_KEY_MAX:-20}
      RATE_LIMIT_BATCH_TENANT_MAX: ${RATE_LIMIT_BATCH_TENANT_MAX:-100}
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-1mb}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '${API_PORT:-3000}:3000'

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['npm', 'run', 'start:worker']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *database-environment
      API_PORT: 3000
      BATCH_QUEUE_PREFIX: ${BATCH_QUEUE_PREFIX:-resolve}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-5}
      WEBHOOK_RETRY_BASE_MS: ${WEBHOOK_RETRY_BASE_MS:-1000}
      BLOCKING_MAX_CANDIDATES: ${BLOCKING_MAX_CANDIDATES:-100}
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-1mb}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}

volumes:
  postgres-data:
  redis-data:
